name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Force complete tests even if matching CI is available
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.ref_type != 'tag' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.validation.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Required strict branch protection keeps this head up to date with main.
          # Explicitly test the run's head_sha so later reuse checks the same tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -m tool.ci.scope
      - name: Check release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -c 'import os; from pathlib import Path; from tool.ci.validation import validate_metadata; validate_metadata(Path.cwd(), os.environ.get("BASE_SHA"))'
      - id: validation
        name: Find complete validation of the same source
        if: steps.scope.outputs.flutter == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.full }}
        run: python3 -m tool.ci.validation
      - run: python3 -m tool.ci.check_docs
      - run: python3 -m tool.generate_release_notes
      - run: python3 -m unittest discover -s tool/tests
  flutter:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Verify generated database code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema steps drift_schemas lib/data/database/schema_steps.g.dart
          dart run drift_dev schema generate drift_schemas test/generated_migrations
          git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test integration_test benchmark patrol_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --exclude-tags slow
  slow:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter test --no-pub --tags slow
  android:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Android release signing policy
        run: python3 -m tool.ci.check_android_signing
      - name: Android backup publication tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
  release:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Build test release bundle
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: 'true'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/ci-symbols
  result:
    name: CI result
    needs: [scope, flutter, slow, android, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          REQUIRED: ${{ needs.scope.outputs.full }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$FLUTTER_RESULT" = success
            test "$SLOW_RESULT" = success
            test "$ANDROID_RESULT" = success
            test "$RELEASE_RESULT" = success
            echo 'Generated code, complete Flutter suite, Android unit tests and release build passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FLUTTER_RESULT" = skipped
            test "$SLOW_RESULT" = skipped
            test "$ANDROID_RESULT" = skipped
            test "$RELEASE_RESULT" = skipped
            echo 'Lightweight checks passed. Complete tests reused (see scope evidence) or documentation-only change.' >> "$GITHUB_STEP_SUMMARY"
          fi
