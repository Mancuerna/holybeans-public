name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.scope.outputs.flutter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -m tool.ci.scope
      - run: python3 -m tool.ci.check_docs
      - run: python3 -m unittest discover -s tool/tests
      - run: git diff --check
  flutter:
    needs: scope
    if: needs.scope.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test benchmark patrol_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Android backup publication tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
  result:
    name: CI result
    needs: [scope, flutter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          REQUIRED: ${{ needs.scope.outputs.flutter }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$FLUTTER_RESULT" = success
            echo 'Complete Flutter suite and Android unit tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FLUTTER_RESULT" = skipped
            echo 'Documentation checks passed. Flutter/Android tests were not run.' >> "$GITHUB_STEP_SUMMARY"
          fi
