name: Release proposal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: please
        with:
          token: ${{ github.token }}
      # GitHub creates an approval-required pull_request run for the release PR.
      # Do not dispatch a second CI; it cannot replace the PR's required check.
      # Release events still need an explicit dispatch when using GITHUB_TOKEN.
      - name: Build the created release
        if: steps.please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.please.outputs.tag_name }}
        run: gh workflow run release-build.yml --ref "$RELEASE_TAG"
